<!DOCTYPE html>
<html>
<head>
  <title>Online Event Registration</title>
  <style>
    body{font-family:Arial;background:#fff4e8;padding:25px}
    form{max-width:650px;margin:auto;background:white;padding:25px;border-radius:12px}
    input,select,textarea{width:100%;padding:9px;margin:6px 0 14px;box-sizing:border-box}
    .choice{width:auto}
    button{padding:10px 18px;margin-right:8px}
  </style>
</head>
<body>
<h1>Online Event Registration - SoundWave Music Festival</h1>
<form>
  <label>Participant Name:</label><input type="text" required>
  <label>Email:</label><input type="email" required>
  <label>Phone:</label><input type="tel">

  <label>Gender:</label><br>
  <input class="choice" type="radio" name="gender"> Male
  <input class="choice" type="radio" name="gender"> Female
  <br><br>

  <label>Ticket Type:</label>
  <select>
    <option>General</option><option>VIP</option><option>Premium</option>
  </select>

  <label>Number of Tickets:</label><input type="number" min="1" max="10">

  <label>Preferred Event Date:</label><input type="date">
  <label>Preferred Time:</label><input type="time">

  <label>Food Preference:</label><br>
  <input class="choice" type="radio" name="food"> Vegetarian
  <input class="choice" type="radio" name="food"> Non-Vegetarian
  <input class="choice" type="radio" name="food"> Vegan
  <br><br>

  <label>Additional Facilities:</label><br>
  <input class="choice" type="checkbox"> Parking
  <input class="choice" type="checkbox"> Wi-Fi
  <input class="choice" type="checkbox"> Backstage Tour
  <br><br>

  <label>Upload Identification Document:</label><input type="file">
  <label>Comments:</label><textarea rows="5" placeholder="Any additional comments..."></textarea>

  <button type="submit">Register</button>
  <button type="reset">Reset</button>
</form>
</body>
</html>
